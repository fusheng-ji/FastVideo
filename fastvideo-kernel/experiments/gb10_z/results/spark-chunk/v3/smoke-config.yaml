models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: MODEL_PATH_FROM_CLI
    trainable: true
    attention_backend: ATTN_QAT_TRAIN
method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod
training:
  distributed:
    num_gpus: 1
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 1
  data:
    data_path: TRAIN_DIRECTORY_FROM_CLI
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 16
    num_height: 256
    num_width: 512
    num_frames: 61
  optimizer:
    learning_rate: 1.0e-06
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0
    foreach_chunk_size: 0
  loop:
    max_train_steps: 1
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: FRESH_OUTPUT_FROM_CLI
    training_state_checkpointing_steps: 0
    checkpoints_total_limit: 0
  tracker:
    project_name: gb10-chunk-validation
    trackers:
    - none
  model:
    enable_gradient_checkpointing_type: full
  dit_precision: fp32
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  smoke_observer:
    _target_: chunk_observer.SmokeObserver
pipeline:
  flow_shift: 1
